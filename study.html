<template data-topic="sre" data-title="SRE fundamentals" data-desc="Reliability targets, incidents and safe delivery" data-note="Written from my own production support experience and standard SRE practice.">
<div class="ch" data-id="targets" data-title="Reliability targets" data-intro="How to say how reliable a service must be, and how to use that number.">
<section data-title="SLI, SLO and SLA">
<ul>
<li><b>SLI</b> (indicator) is what you measure. Example: the percentage of requests that return a successful response.</li>
<li><b>SLO</b> (objective) is the target for that measurement. Example: 99.9% of requests succeed over 30 days.</li>
<li><b>SLA</b> (agreement) is the promise made to a customer, with a penalty if it is broken. An SLA should always be looser than the SLO.</li>
</ul>
<div class="tw"><table>
<tr><th>SLO</th><th>Allowed downtime in 30 days</th></tr>
<tr><td>99%</td><td>about 7.2 hours</td></tr>
<tr><td>99.9%</td><td>about 43 minutes</td></tr>
<tr><td>99.99%</td><td>about 4.3 minutes</td></tr>
</table></div>
<div class="note"><b>Remember:</b> every extra nine costs far more than the one before it. Pick the SLO your users actually need, not the highest number.</div>
</section>
<section data-title="Error budget">
<p>The error budget is the part of the SLO you are allowed to miss: <code>100% - SLO</code>. With a 99.9% SLO, the budget is 0.1% of requests.</p>
<ul>
<li>Budget left: ship features, run risky changes.</li>
<li>Budget finished: slow down, fix reliability first, freeze risky releases.</li>
</ul>
<p>This turns the argument "reliability or speed" into a shared number that both developers and operations agree on.</p>
</section>
</div>
<div class="ch" data-id="signals" data-title="Monitoring signals" data-intro="The few signals that tell you whether a service is healthy.">
<section data-title="The four golden signals">
<div class="tw"><table>
<tr><th>Signal</th><th>Question it answers</th></tr>
<tr><td>Latency</td><td>How long do requests take? Look at the slow ones (p95, p99), not only the average.</td></tr>
<tr><td>Traffic</td><td>How much demand is the system getting?</td></tr>
<tr><td>Errors</td><td>How many requests fail, including failures that return a 200 but wrong data?</td></tr>
<tr><td>Saturation</td><td>How full is the system? CPU, memory, disk, connections, queue depth.</td></tr>
</table></div>
</section>
</div>
<div class="ch" data-id="incidents" data-title="Incidents and postmortems" data-intro="What to do when something breaks, and how to learn from it.">
<section data-title="Handling an incident">
<ol>
<li><b>Detect and acknowledge.</b> An alert fires, someone owns it.</li>
<li><b>Triage.</b> How many users are affected? Set a severity.</li>
<li><b>Mitigate first.</b> Roll back, scale up, fail over, disable the feature. Stop the damage before hunting the cause.</li>
<li><b>Communicate.</b> Keep a clear timeline and regular updates for stakeholders.</li>
<li><b>Resolve and verify.</b> Confirm with metrics, not with a feeling.</li>
<li><b>Write the postmortem.</b></li>
</ol>
<div class="note"><b>Rule of thumb:</b> mitigate first, root cause later. A rollback that restores service in five minutes is better than a perfect diagnosis in two hours.</div>
</section>
<section data-title="RCA and blameless postmortem">
<p>A good postmortem explains how the system allowed the failure, not who made the mistake. People who fear blame hide information, and then the same failure comes back.</p>
<ul>
<li><b>Summary and impact:</b> what broke, for whom, for how long.</li>
<li><b>Timeline:</b> detection, actions, recovery, with timestamps.</li>
<li><b>Trigger vs root cause:</b> the trigger is what set it off (a deploy). The root cause is the weakness that let it hurt (no canary, no rollback test).</li>
<li><b>What went well, what went badly.</b></li>
<li><b>Action items:</b> each with an owner and a date. A postmortem without owners is just a story.</li>
</ul>
</section>
</div>
<div class="ch" data-id="delivery" data-title="Reliable delivery" data-intro="Shipping changes without breaking things, and removing manual work.">
<section data-title="Safe changes">
<ul>
<li>Keep changes small and reversible.</li>
<li>Roll out gradually (canary), watch the golden signals, then continue.</li>
<li>Always have a rollback plan before you start.</li>
<li>Validate after deployment: health checks, key user journeys, error rate.</li>
</ul>
</section>
<section data-title="Toil and automation">
<p>Toil is manual, repetitive work that grows as the service grows and gives no lasting value. If you do the same task by hand three times, write a script or a pipeline for it. Time saved goes back into reliability work.</p>

</article>
</section>
</div>
<div class="ch" data-id="qa" data-title="Interview questions" data-intro="Practice questions with short answers. Tap a question to see the answer.">
<section data-title="Common questions">
<details><summary>What is the difference between SLI, SLO and SLA?</summary><p>SLI is the number you measure, for example the percentage of successful requests. SLO is the internal target for that number, for example 99.9% over 30 days. SLA is the promise made to a customer, with a penalty if it is broken, and it is usually looser than the SLO.</p></details>
<details><summary>What is an error budget and how do you use it?</summary><p>It is 100% minus the SLO. A 99.9% SLO leaves 0.1%, about 43 minutes of failure in 30 days. While budget is left, teams ship changes. When it is used up, risky releases stop and reliability work comes first.</p></details>
<details><summary>Production is down and the cause is unknown. What do you do first?</summary><p>Check the impact and scope, ask what changed recently, then mitigate: roll back, fail over or scale. Tell stakeholders what is happening. Find the root cause after service is restored.</p></details>
<details><summary>Is "the disk was full" a root cause?</summary><p>Usually it is a symptom. Ask why it filled: no log rotation, no alert at 80%, or a runaway log. The missing control is the root cause, and the fixes are rotation, alerting and automated cleanup.</p></details>
<details><summary>How do you reduce MTTR?</summary><p>Alert on symptoms users feel, keep clear runbooks and dashboards, make rollback fast and safe, automate the common fixes, and practise incident drills.</p></details>
</section>
</div>

<template data-topic="linux" data-title="Linux troubleshooting" data-desc="CPU, memory, disk, network and logs" data-note="Written from my own Linux administration and production support experience.">
<div class="ch" data-id="first" data-title="First look and performance" data-intro="A fixed order to check a slow or broken server.">
<section data-title="First look (one minute)">
<div class="cb"><pre><code>uptime                 # load average and how long the server is up
free -m                # memory (look at "available")
df -h                  # disk space
df -i                  # inodes (disk can be "full" with space left)
top                    # live CPU and memory by process
dmesg -T | tail -30    # recent kernel messages (OOM, disk errors)</code></pre></div>
</section>
<section data-title="CPU and load">
<p>Load average is the number of tasks running or waiting. Compare it with the CPU core count from <code>nproc</code>. A load of 8 is fine on 16 cores but heavy on 2.</p>
<div class="cb"><pre><code>nproc
ps aux --sort=-%cpu | head
top -H -p &lt;pid&gt;       # per-thread view of one process</code></pre></div>
<p>High load with low CPU use often means processes are waiting on disk or network, not computing.</p>
</section>
<section data-title="Memory and the OOM killer">
<ul>
<li>Read the <b>available</b> column in <code>free -m</code>, not "free". Linux uses spare memory for cache.</li>
<li>If a process vanished without an error, the kernel may have killed it for using too much memory.</li>
</ul>
<div class="cb"><pre><code>dmesg -T | grep -i "killed process"
journalctl -k | grep -i oom
ps aux --sort=-%mem | head</code></pre></div>
</section>
</div>
<div class="ch" data-id="disk" data-title="Disk and storage" data-intro="Why a disk is full and how to find what is using it.">
<section data-title="Disk">
<div class="cb"><pre><code>df -h
du -sh /var/* 2&gt;/dev/null | sort -h | tail      # biggest folders
find / -xdev -type f -size +500M 2&gt;/dev/null    # very large files
lsof +L1                                         # deleted files still held open
iostat -x 1                                      # disk busy time</code></pre></div>
<div class="note"><b>Common trap:</b> a big log file is deleted but the application still has it open, so the space is not freed. <code>lsof +L1</code> shows it. Restart or reload the application to release the space.</div>
</section>
</div>
<div class="ch" data-id="net" data-title="Network checks" data-intro="Work from the inside out to find where traffic stops.">
<section data-title="Network">
<div class="cb"><pre><code>ip a                       # interfaces and IP addresses
ip route                   # routing table
ss -tulnp                  # listening ports and which process owns them
ss -s                      # socket summary
curl -v http://host:port   # test an HTTP endpoint
nc -zv host port           # test if a TCP port is open
dig example.com            # DNS lookup
traceroute host            # where the path breaks</code></pre></div>
<p>Work from the inside out: is the app listening on the port, can the server reach the destination, does DNS resolve, and is a firewall in between?</p>
</section>
</div>
<div class="ch" data-id="logs" data-title="Services and logs" data-intro="Read service status and logs, and keep logs from filling the disk.">
<section data-title="Services and logs">
<div class="cb"><pre><code>systemctl status myapp
systemctl restart myapp
journalctl -u myapp --since "1 hour ago"
journalctl -u myapp -f             # follow live
tail -f /var/log/myapp/app.log
grep -i error /var/log/myapp/app.log | tail</code></pre></div>
</section>
<section data-title="Log rotation">
<p>Logs that are never rotated slowly fill the disk. <code>logrotate</code> compresses and removes old logs on a schedule.</p>
<div class="cb"><pre><code>/var/log/myapp/*.log {
    daily
    rotate 14
    compress
    missingok
    notifempty
    copytruncate
}</code></pre></div>
<ul>
<li><code>copytruncate</code> copies the log and empties the original, so the app does not need to reopen the file. A few lines may be lost in the gap.</li>
<li>Test a config without changing anything: <code>logrotate -d /etc/logrotate.d/myapp</code>. Force a run with <code>logrotate -f</code>.</li>
</ul>
</section>
</div>
<div class="ch" data-id="perm" data-title="Permissions" data-intro="Read and set file permissions the right way.">
<section data-title="File permissions">
<div class="tw"><table>
<tr><th>Number</th><th>Meaning</th></tr>
<tr><td>4 / 2 / 1</td><td>read / write / execute, added together per user, group, others</td></tr>
<tr><td>755</td><td>owner can do everything, everyone else can read and run (scripts, folders)</td></tr>
<tr><td>644</td><td>owner can read and write, everyone else only read (normal files)</td></tr>
<tr><td>600</td><td>only the owner can read and write (private keys)</td></tr>
</table></div>
<div class="cb"><pre><code>ls -l file
chmod 640 file
chown appuser:appgroup file</code></pre></div>

</article>
</section>
</div>
<div class="ch" data-id="qa" data-title="Interview questions" data-intro="Practice questions with short answers. Tap a question to see the answer.">
<section data-title="Common questions">
<details><summary>Load average is 20 on a 4-core server. What does it mean?</summary><p>About 5 tasks per core are running or waiting, so the server is overloaded. Waiting on disk also raises load. Compare CPU use with I/O wait in top or vmstat, then check the top processes.</p></details>
<details><summary>df -h shows 90% but du does not add up. Why?</summary><p>A deleted file is still held open by a process (find it with lsof +L1), or data is hidden under a mount point. Restarting or reloading the process frees the space.</p></details>
<details><summary>The disk has free space but you get "No space left on device".</summary><p>The inodes are used up, check df -i. This happens with huge numbers of small files. Find the folder with the most files and clean it.</p></details>
<details><summary>A port is listening but clients cannot connect. What do you check?</summary><p>The bind address (127.0.0.1 versus 0.0.0.0) with ss -tulnp, then the host firewall, the network firewall or security group, and the route.</p></details>
<details><summary>An application stopped and its own log shows no error.</summary><p>The kernel OOM killer may have ended it. Check dmesg -T | grep -i killed, then look at memory limits and for a leak.</p></details>
<details><summary>What is the difference between connection refused and connection timeout?</summary><p>Refused means the host was reached but nothing is listening on that port. A timeout means packets are being dropped or cannot find a route, which points to a firewall or routing problem.</p></details>
</section>
</div>
</template>
<template data-topic="k8s" data-title="Kubernetes troubleshooting" data-desc="Pods, services, nodes and rollouts" data-note="Written for study. The commands are standard kubectl usage; see the official Kubernetes documentation for details.">
<div class="ch" data-id="model" data-title="How it fits together" data-intro="The objects, and the order in which to debug them.">
<section data-title="The mental model">
<ul>
<li>A <b>Pod</b> runs your containers. A <b>ReplicaSet</b> keeps the right number of pods. A <b>Deployment</b> manages ReplicaSets and rollouts.</li>
<li>A <b>Service</b> finds pods by <b>labels</b> and gives them one stable address. The pod IPs behind it are called <b>Endpoints</b>.</li>
<li>The <b>control plane</b> (API server, etcd, scheduler, controller manager) decides. The <b>kubelet</b> on each node runs the pods.</li>
</ul>
<div class="note"><b>First check, always:</b> are you on the right cluster and namespace? <code>kubectl config current-context</code> and add <code>-n &lt;namespace&gt;</code>.</div>
</section>
<section data-title="The debug order">
<div class="cb"><pre><code>kubectl get pods -o wide                       # status, node, restarts
kubectl describe pod &lt;pod&gt;                     # events at the bottom tell the story
kubectl logs &lt;pod&gt;                             # current logs
kubectl logs &lt;pod&gt; --previous                  # logs of the crashed container
kubectl get events --sort-by=.lastTimestamp    # what happened recently
kubectl exec -it &lt;pod&gt; -- sh                   # look inside</code></pre></div>
</section>
</div>
<div class="ch" data-id="pods" data-title="Pod problems" data-intro="What each pod state means and where to look.">
<section data-title="Pod states and what they mean">
<div class="tw"><table>
<tr><th>State</th><th>Usual cause and where to look</th></tr>
<tr><td>Pending</td><td>No node can run it: not enough CPU or memory, a taint with no toleration, a wrong nodeSelector, or an unbound volume. See <code>FailedScheduling</code> in describe.</td></tr>
<tr><td>ContainerCreating</td><td>Pulling the image, mounting a volume, or the network plugin is not ready. Check events.</td></tr>
<tr><td>ImagePullBackOff</td><td>Wrong image name or tag, or no permission for a private registry. Check the image and <code>imagePullSecrets</code>.</td></tr>
<tr><td>CrashLoopBackOff</td><td>The app starts and exits again and again. Read <code>logs --previous</code> and the exit code. Also check a failing liveness probe.</td></tr>
<tr><td>OOMKilled</td><td>The container used more memory than its limit. Exit code 137. Raise the limit or fix the leak.</td></tr>
<tr><td>Evicted</td><td>The node ran short of memory or disk. Look at node pressure.</td></tr>
<tr><td>Terminating (stuck)</td><td>A finalizer or a node problem is blocking deletion. Force delete is the last option.</td></tr>
</table></div>
<p>Exit codes help: <code>1</code> is usually an application error, <code>137</code> means the process was killed (often memory), <code>143</code> means a normal stop signal.</p>
</section>
<section data-title="Probes">
<ul>
<li><b>Liveness:</b> is the container stuck? If it fails, Kubernetes restarts it.</li>
<li><b>Readiness:</b> can it take traffic now? If it fails, the pod is removed from the Service, but not restarted.</li>
<li><b>Startup:</b> gives slow apps time to start before the other probes begin.</li>
</ul>
<div class="note"><b>Common trap:</b> a liveness probe that is too strict kills a healthy but slow app, and you see an endless restart loop. Check probe timing before blaming the code.</div>
</section>
<section data-title="Requests, limits and QoS">
<ul>
<li><b>Requests</b> are what the scheduler reserves for the pod. <b>Limits</b> are the maximum it may use.</li>
<li>Exceeding the memory limit kills the container (OOMKilled). Exceeding the CPU limit only slows it down (throttling).</li>
<li>Pods with requests equal to limits are <i>Guaranteed</i> and are evicted last. Pods with no requests are <i>BestEffort</i> and are evicted first.</li>
</ul>

</article>
</section>
</div>
<div class="ch" data-id="net" data-title="Networking" data-intro="When a Service cannot be reached.">
<section data-title="Service not reachable">
<div class="cb"><pre><code>kubectl get svc &lt;svc&gt;
kubectl get endpoints &lt;svc&gt;                    # empty = selector does not match any pod
kubectl get pods --show-labels                 # compare labels with the Service selector
kubectl describe svc &lt;svc&gt;                     # port and targetPort
kubectl exec -it &lt;pod&gt; -- nslookup &lt;svc&gt;       # DNS from inside the cluster
kubectl exec -it &lt;pod&gt; -- curl -v http://&lt;svc&gt;:&lt;port&gt;</code></pre></div>
<ul>
<li>Empty endpoints almost always mean the labels do not match, or the pods are not Ready.</li>
<li>Check <code>port</code> (what clients call) against <code>targetPort</code> (what the container listens on).</li>
<li>If DNS fails, look at the CoreDNS pods in <code>kube-system</code>. If only some traffic fails, check NetworkPolicies.</li>
</ul>
</section>
</div>
<div class="ch" data-id="ops" data-title="Nodes and rollouts" data-intro="Node trouble, new releases and rollbacks.">
<section data-title="Node problems">
<div class="cb"><pre><code>kubectl get nodes
kubectl describe node &lt;node&gt;          # conditions: Ready, MemoryPressure, DiskPressure
kubectl top node                       # needs metrics-server
journalctl -u kubelet -f               # on the node itself
kubectl cordon &lt;node&gt;                  # stop new pods landing here
kubectl drain &lt;node&gt; --ignore-daemonsets --delete-emptydir-data
kubectl uncordon &lt;node&gt;                # allow scheduling again</code></pre></div>
</section>
<section data-title="Deployments and rollbacks">
<div class="cb"><pre><code>kubectl rollout status deployment/&lt;name&gt;
kubectl rollout history deployment/&lt;name&gt;
kubectl rollout undo deployment/&lt;name&gt;       # back to the previous version
kubectl rollout restart deployment/&lt;name&gt;    # fresh pods, picks up new ConfigMap or Secret</code></pre></div>
<p>If a new release breaks things, <code>rollout undo</code> first, investigate after. It follows the same rule as any incident: mitigate first.</p>
</section>
</div>
<div class="ch" data-id="qa" data-title="Interview questions" data-intro="Practice questions with short answers. Tap a question to see the answer.">
<section data-title="Common questions">
<details><summary>A pod is in CrashLoopBackOff. What are your first steps?</summary><p>Run describe pod and read the events, then logs --previous, and check the exit code. After that look at the probes, the config and secrets, and the image command.</p></details>
<details><summary>A pod is stuck in Pending.</summary><p>Run describe pod and look for FailedScheduling. Common causes are not enough CPU or memory, a taint with no toleration, a wrong nodeSelector or affinity, or an unbound PVC.</p></details>
<details><summary>A Service exists but its endpoints are empty.</summary><p>The Service selector does not match any pod labels, or the pods are not Ready. Compare the labels and check the readiness probe.</p></details>
<details><summary>What is the difference between liveness and readiness probes?</summary><p>Liveness decides if a container must be restarted. Readiness decides if it should receive traffic, and a failing pod is only removed from the Service, not restarted.</p></details>
<details><summary>What does exit code 137 mean?</summary><p>The process was killed with SIGKILL, very often by the OOM killer because it passed its memory limit. Check the limit and the real memory use.</p></details>
<details><summary>A new release broke production. What do you do?</summary><p>Run kubectl rollout undo to restore the last working version, confirm health, then investigate. Mitigate first, find the cause after.</p></details>
</section>
</div>

<template data-topic="sysdesign" data-soon data-title="System design" data-desc="Design reliable systems on paper">
<div class="ch" data-id="approach" data-title="A simple approach" data-intro="Requirements first"></div>
<div class="ch" data-id="scale" data-title="Scaling and load balancing" data-intro="Horizontal scale and health checks"></div>
<div class="ch" data-id="cache" data-title="Caching" data-intro="Where and what to cache"></div>

<div class="ch" data-id="rel" data-title="Reliability patterns" data-intro="Timeouts, retries and circuit breakers"></div>
</template>
<template data-topic="python" data-soon data-title="Python for automation" data-desc="Scripts that save time in operations">
<div class="ch" data-id="basic" data-title="Python basics" data-intro="Types, loops and functions"></div>
<div class="ch" data-id="files" data-title="Files and text" data-intro="Parsing logs"></div>
<div class="ch" data-id="api" data-title="Working with APIs" data-intro="Requests and JSON"></div>
<div class="ch" data-id="ops" data-title="Scripts for operations" data-intro="Health checks and reports"></div>
<div class="ch" data-id="sched" data-title="Packaging and scheduling" data-intro="Running scripts reliably"></div>
</template>
<script>
(function(){
var T=[],DQ=[],byId={},ORDER=['sre','linux','net','git','bash','docker','k8sf','k8s','helm','cicd','tf','ansible','aws','mon','sec','interview','sql','sysdesign','python'],view=document.getElementById('view'),q=document.getElementById('q'),sr=document.getElementById('sr'),pend=null,rm=matchMedia('(prefers-reduced-motion: reduce)').matches,read={};
try{read=JSON.parse(localStorage.getItem('sread')||'{}')}catch(e){}
var S={last:null,days:[],qa:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('sstate')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('sstate',JSON.stringify(S))}catch(e){}}
function dk(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function touch(){var k=dk(new Date());if(S.days.indexOf(k)<0){S.days.push(k);S.days=S.days.slice(-400)}}
function streak(){var n=0,d=new Date();while(true){if(S.days.indexOf(dk(d))>-1){n++;d.setDate(d.getDate()-1)}else if(n===0&&dk(d)===dk(new Date())){d.setDate(d.getDate()-1)}else break}return n}
function mark(t,c){S.last={t:t.id,c:c.id};touch();save();if(window.goatcounter&&window.goatcounter.count){try{window.goatcounter.count({path:'study/'+t.id+'/'+c.id,title:t.title+': '+c.title,event:true})}catch(e){}}}
function words(s){return s.trim().split(/\s+/).length}
document.querySelectorAll('template[data-topic]').forEach(function(tp){
 var t={id:tp.dataset.topic,title:tp.dataset.title,desc:tp.dataset.desc,note:tp.dataset.note||'',soon:tp.hasAttribute('data-soon'),chapters:[]};
 tp.content.querySelectorAll('.ch').forEach(function(c){
  var ch={id:c.dataset.id,title:c.dataset.title,intro:c.dataset.intro||'',sections:[],w:0};
  c.querySelectorAll('section').forEach(function(s,i){var raw=s.textContent.replace(/\s+/g,' ').trim();ch.w+=words(raw);ch.sections.push({id:t.id+'-'+ch.id+'-'+i,title:s.dataset.title,html:s.innerHTML,raw:raw});[].forEach.call(s.querySelectorAll('details'),function(d){DQ.push({q:d.querySelector('summary').textContent,a:d.querySelector('p').textContent,t:t.id,c:ch.id,tt:t.title})})});
  t.chapters.push(ch)});
 T.push(t);byId[t.id]=t});
T.sort(function(a,b){return ORDER.indexOf(a.id)-ORDER.indexOf(b.id)});
var YT='https://www.youtube.com/results?search_query=';
function yt(n,l,q,d){return {n:n,l:l,u:YT+encodeURIComponent(q),d:d}}
function nana(q){return yt('TechWorld with Nana','English','TechWorld with Nana '+q,'Clear, beginner-friendly DevOps tutorials')}
function mp(q){return yt('M Prashant','Hindi','M Prashant '+q+' Hindi','Explanations in Hindi')}
var VIDEOS={
 linux:[yt('Server Gyan, Dr. Lokendra','Hindi','Server Gyan Dr Lokendra Linux','Linux and server topics in Hindi')],
 docker:[nana('Docker'),mp('Docker')],
 k8sf:[nana('Kubernetes'),mp('Kubernetes')],
 k8s:[nana('Kubernetes troubleshooting')],
 helm:[nana('Helm ArgoCD')],
 cicd:[nana('Jenkins CI CD'),mp('Jenkins CI CD')],
 tf:[nana('Terraform'),mp('Terraform')],
 ansible:[nana('Ansible')],
 aws:[nana('AWS'),mp('AWS')],
 sysdesign:[yt('Gaurav Sen','English','Gaurav Sen system design','System design concepts explained step by step')],
 python:[yt('CodeWithHarry','Hindi','CodeWithHarry Python tutorial Hindi','Beginner tutorials in Hindi')],
 sql:[yt('CodeWithHarry','Hindi','CodeWithHarry SQL tutorial Hindi','Beginner tutorials in Hindi')]
};
function vids(t){var v=VIDEOS[t.id];if(!v||!v.length)return '';return '<div class="vids"><h3>Watch and learn</h3><div class="vgrid">'+v.map(function(x){return '<a class="vc" href="'+x.u+'" target="_blank" rel="noopener noreferrer" data-goatcounter-click="video-'+t.id+'"><b>'+x.n+'</b><span>'+x.l+'</span><small>'+x.d+'</small></a>'}).join('')+'</div></div>'}
function mins(w){return Math.max(1,Math.round(w/200))}
function nsec(t){return t.chapters.reduce(function(a,c){return a+c.sections.length},0)}
function tw(t){return t.chapters.reduce(function(a,c){return a+c.w},0)}
function nread(t){return t.chapters.filter(function(c){return read[t.id+'/'+c.id]}).length}
function setTitle(s){document.title=s+' | Sushobhit Kumar'}
function lib(){
 var tot=0,rd=0;T.forEach(function(t){if(!t.soon){tot+=t.chapters.length;rd+=nread(t)}});
 var kq=Object.keys(S.qa).filter(function(k){return S.qa[k]==='k'}).length,sk=streak();
 var h='<div class="full"><div class="libhead"><p class="eyebrow">Study notes</p><h1>Learn DevOps and SRE, one small step a day</h1><p class="lead">Short chapters, real troubleshooting and practice questions. Follow the path from the top, or jump to any topic.</p></div>';
 h+='<div class="stats"><div><b>'+sk+'</b><span>day streak</span></div><div><b>'+rd+' / '+tot+'</b><span>chapters read</span></div><div><b>'+kq+'</b><span>questions known</span></div></div>';
 if(S.last&&byId[S.last.t]){var lt=byId[S.last.t],lc=lt.chapters.filter(function(x){return x.id===S.last.c})[0];if(lc&&!lt.soon)h+='<a class="resume" href="#'+lt.id+'/'+lc.id+'"><small>Continue where you left off</small><b>'+lc.title+'</b><span>'+lt.title+'</span></a>'}
 if(DQ.length){var d=new Date(),q=DQ[(d.getFullYear()*372+d.getMonth()*31+d.getDate())%DQ.length];h+='<div class="daily"><small>Question of the day</small><h3>'+q.q+'</h3><button type="button" id="dqb">Show answer</button><p id="dqa" hidden>'+q.a+' <a href="#'+q.t+'/'+q.c+'">More in '+q.tt+'</a></p></div>'}
 h+='<h2 class="ph">The learning path</h2><div class="cards">';
 T.forEach(function(t,i){
  if(t.soon){h+='<a class="tc planned" href="#'+t.id+'"><span class="st">Step '+(i+1)+'</span><h2>'+t.title+'</h2><p>'+t.desc+'</p><span class="ct">Coming soon, '+t.chapters.length+' chapters planned</span></a>'}
  else{h+='<a class="tc" href="#'+t.id+'"><span class="st">Step '+(i+1)+'</span><h2>'+t.title+'</h2><p>'+t.desc+'</p><span class="tm">'+t.chapters.length+' chapters, '+nsec(t)+' sections, about '+mins(tw(t))+' min</span><span class="tp">'+nread(t)+' of '+t.chapters.length+' chapters read</span></a>'}
 });
 view.innerHTML=h+'</div></div>';
 var b=document.getElementById('dqb');if(b)b.addEventListener('click',function(){document.getElementById('dqa').hidden=false;b.hidden=true});
 setTitle('Study notes');
}
function side(t,cur){
 var h='<aside class="side"><a class="stitle" href="#'+t.id+'">'+t.title+'</a><h2>Chapters</h2><div id="tlist">';
 t.chapters.forEach(function(c,i){h+='<a href="#'+t.id+(t.soon?'':'/'+c.id)+'"'+(cur===c.id?' class="on"':'')+'><b>'+(i+1)+'.</b>'+c.title+(read[t.id+'/'+c.id]?'<small>read</small>':'')+'</a>'});
 return h+'</div><a class="back" href="#">All topics</a></aside>';
}
function topic(t){
 var h='<div class="wrap">'+side(t,'')+'<main><article class="topic"><p class="crumb"><a href="#">Study notes</a> / '+t.title+'</p><h1>'+t.title+'</h1><p class="meta">'+t.chapters.length+' chapters, '+nsec(t)+' sections, about '+mins(tw(t))+' min read</p><p class="lead">'+t.desc+'. Choose a chapter to start.</p><div class="rows">';
 t.chapters.forEach(function(c,i){if(t.soon){h+='<div class="row soon"><span class="n">'+(i+1)+'</span><div><h3>'+c.title+'</h3><p>'+c.intro+'</p></div></div>'}else{h+='<a class="row" href="#'+t.id+'/'+c.id+'"><span class="n">'+(i+1)+'</span><div><h3>'+c.title+'</h3><p>'+c.intro+'</p><p class="secs">'+c.sections.map(function(s){return s.title}).join('  /  ')+'</p></div></a>'}});
 view.innerHTML=h+'</div>'+vids(t)+(t.note?'<p class="end">'+t.note+'</p>':'')+'</article></main></div>';setTitle(t.title+' | Study notes');
 if(t.soon){view.querySelector('.meta').textContent='Coming soon, '+t.chapters.length+' chapters planned';view.querySelector('.lead').textContent=t.desc+'. These chapters are planned and will be added soon.'}
}
function chapter(t,c){
 var i=t.chapters.indexOf(c),h='<div class="wrap">'+side(t,c.id)+'<main><article class="topic"><p class="crumb"><a href="#">Study notes</a> / <a href="#'+t.id+'">'+t.title+'</a> / '+c.title+'</p><h1>'+c.title+'</h1><p class="meta">Chapter '+(i+1)+' of '+t.chapters.length+', '+c.sections.length+' sections, about '+mins(c.w)+' min read</p><p class="lead">'+c.intro+'</p><nav class="toc" aria-label="Sections in this chapter">';
 c.sections.forEach(function(s){h+='<a href="#" data-go="'+s.id+'">'+s.title+'</a>'});
 h+='</nav>';
 c.sections.forEach(function(s){h+='<h2 id="'+s.id+'">'+s.title+'</h2>'+s.html});
 var p=t.chapters[i-1],n=t.chapters[i+1];
 h+=vids(t);h+='<div class="pn" id="pn">'+(p?'<a class="pv" href="#'+t.id+'/'+p.id+'"><small>Previous chapter</small>'+p.title+'</a>':'<a class="pv" href="#'+t.id+'"><small>Back to</small>'+t.title+'</a>')+(n?'<a class="nx" href="#'+t.id+'/'+n.id+'"><small>Next chapter</small>'+n.title+'</a>':'<a class="nx" href="#"><small>All done, back to</small>Study notes</a>')+'</div></article></main></div>';
 view.innerHTML=h;setTitle(c.title+' | '+t.title);
 mark(t,c);
 if(view.querySelector('details')){var tc=view.querySelector('.toc');tc.insertAdjacentHTML('afterend','<button type="button" class="qabtn" id="qaall">Open all answers</button>');
  document.getElementById('qaall').addEventListener('click',function(){var d=view.querySelectorAll('details'),open=this.dataset.o!=='1';[].forEach.call(d,function(x){x.open=open});this.dataset.o=open?'1':'0';this.textContent=open?'Close all answers':'Open all answers'});
  var ds=view.querySelectorAll('details'),stat=document.createElement('span');stat.id='qastat';document.getElementById('qaall').after(stat);
  function upd(){var k=0;[].forEach.call(ds,function(d,qi){if(S.qa[t.id+'/'+c.id+'/'+qi]==='k')k++});stat.textContent='Known '+k+' of '+ds.length}
  [].forEach.call(ds,function(d,qi){var key=t.id+'/'+c.id+'/'+qi,r=document.createElement('div');r.className='rate';r.innerHTML='<button type="button" data-r="k">I knew this</button><button type="button" data-r="r">Revise later</button>';d.appendChild(r);
   function paint(){d.classList.toggle('known',S.qa[key]==='k');d.classList.toggle('rev',S.qa[key]==='r')}paint();
   r.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.qa[key]=b.dataset.r;save();paint();upd()})});
  upd()}
 [].forEach.call(view.querySelectorAll('.cb'),function(b){var cp=document.createElement('button');cp.type='button';cp.textContent='Copy';cp.addEventListener('click',function(){var x=b.querySelector('code').textContent;if(navigator.clipboard){navigator.clipboard.writeText(x).then(function(){cp.textContent='Copied';setTimeout(function(){cp.textContent='Copy'},1500)})}});b.appendChild(cp)});
 [].forEach.call(view.querySelectorAll('[data-go]'),function(a){a.addEventListener('click',function(e){e.preventDefault();go(a.dataset.go)})});
 var key=t.id+'/'+c.id;
 if('IntersectionObserver' in window){var o=new IntersectionObserver(function(es){if(es[0].isIntersecting){o.disconnect();if(!read[key]){read[key]=1;try{localStorage.setItem('sread',JSON.stringify(read))}catch(e){}var on=view.querySelector('#tlist a.on');if(on&&!on.querySelector('small'))on.insertAdjacentHTML('beforeend','<small>read</small>')}}},{threshold:.6});o.observe(document.getElementById('pn'))}
}
function go(id){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:rm?'auto':'smooth'})}
function route(){
 var h=location.hash.replace(/^#\/?/,'').split('/'),t=byId[h[0]];
 if(!t){lib();window.scrollTo(0,0);return}
 var c=h[1]&&t.chapters.filter(function(x){return x.id===h[1]})[0];
 if(c&&!t.soon)chapter(t,c);else topic(t);
 if(pend){var id=pend;pend=null;setTimeout(function(){go(id)},60)}else window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
q.addEventListener('input',function(){
 var s=q.value.trim().toLowerCase();if(s.length<2){sr.hidden=true;return}
 var res=[];
 T.forEach(function(t){t.chapters.forEach(function(c){c.sections.forEach(function(x){var i=x.raw.toLowerCase().indexOf(s),j=x.title.toLowerCase().indexOf(s);if(i>-1||j>-1)res.push({t:t,c:c,x:x,i:Math.max(i,0)})})})});
 if(!res.length){sr.innerHTML='<a href="#" onclick="return false"><b>No match</b><small>Try a different word</small></a>';sr.hidden=false;return}
 sr.innerHTML=res.slice(0,8).map(function(r){var sn=r.x.raw.slice(Math.max(0,r.i-30),r.i+70);return '<a href="#'+r.t.id+'/'+r.c.id+'" data-s="'+r.x.id+'"><b>'+r.x.title+'</b><small>'+r.t.title+' / '+r.c.title+'</small><small>...'+sn.replace(/</g,'&lt;')+'...</small></a>'}).join('');
 sr.hidden=false;
});
sr.addEventListener('click',function(e){var a=e.target.closest('a');if(!a||!a.dataset.s)return;pend=a.dataset.s;sr.hidden=true;q.value='';if(location.hash==a.getAttribute('href')){route()}});
document.addEventListener('click',function(e){if(!e.target.closest('.srch'))sr.hidden=true});
q.addEventListener('keydown',function(e){if(e.key==='Escape'){q.value='';sr.hidden=true}});
route();
var bar=document.getElementById('bar');
window.addEventListener('scroll',function(){var h=document.documentElement,m=h.scrollHeight-h.clientHeight;bar.style.width=(m>0?h.scrollTop/m*100:0)+'%'},{passive:true});
var root=document.documentElement;
function toggle(){var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':!matchMedia('(prefers-color-scheme: light)').matches;var n=dark?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}}
try{var sv=localStorage.getItem('theme');if(sv)root.setAttribute('data-theme',sv)}catch(e){}
document.getElementById('theme').addEventListener('click',toggle);
var rd=document.getElementById('read'),sizes=[.9,1,1.1,1.2,1.35],fi=1;
function setRead(on){if(on){root.setAttribute('data-read','paper')}else{root.removeAttribute('data-read')}rd.setAttribute('aria-pressed',on?'true':'false');rd.textContent=on?'Reading mode: on':'Reading mode';try{localStorage.setItem('sread-mode',on?'1':'0')}catch(e){}}
function setFs(i){fi=Math.max(0,Math.min(sizes.length-1,i));root.style.setProperty('--rs',sizes[fi]+'rem');try{localStorage.setItem('sfs',fi)}catch(e){}}
rd.addEventListener('click',function(){setRead(!root.hasAttribute('data-read'))});
document.getElementById('fm').addEventListener('click',function(){setFs(fi-1)});
document.getElementById('fp').addEventListener('click',function(){setFs(fi+1)});
try{var sm=localStorage.getItem('sread-mode');if(sm==='1'||sm===null)setRead(true);var sf=parseInt(localStorage.getItem('sfs'),10);if(!isNaN(sf))setFs(sf)}catch(e){}
})();
</script>
</body>
